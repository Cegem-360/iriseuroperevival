name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: guard
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_PASSWORD }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy secrets (DEPLOY_HOST/DEPLOY_USER/DEPLOY_PASSWORD) are not set — skipping deploy."
          fi

      - name: Setup PHP
        if: steps.guard.outputs.go == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Configure Filament credentials
        if: steps.guard.outputs.go == 'true'
        run: composer config http-basic.packages.filamentphp.com "${{ secrets.FILAMENT_USERNAME }}" "${{ secrets.FILAMENT_LICENSE_KEY }}"

      - name: Install PHP dependencies (needed for Filament vendor CSS)
        if: steps.guard.outputs.go == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        if: steps.guard.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build assets
        if: steps.guard.outputs.go == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit built assets if changed
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/build
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Build assets [skip ci]"
            git push --no-verify origin HEAD:main
          fi

      - name: Install sshpass
        if: steps.guard.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy on server
        if: steps.guard.outputs.go == 'true'
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -e
          cd ~/repositories/iriseuroperevival
          git pull --ff-only origin main
          PHP=/opt/cpanel/ea-php84/root/usr/bin/php
          $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          $PHP artisan migrate --force
          $PHP artisan storage:link || true
          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan filament:optimize
          $PHP artisan queue:restart
          REMOTE

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: guard
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_PASSWORD }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy secrets (DEPLOY_HOST/DEPLOY_USER/DEPLOY_PASSWORD) are not set — skipping deploy."
          fi

      - name: Setup Node
        if: steps.guard.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build assets
        if: steps.guard.outputs.go == 'true'
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        if: steps.guard.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Deploy to production
        if: steps.guard.outputs.go == 'true'
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_PATH: ${{ secrets.DEPLOY_PATH || '~/repositories/iriseuroperevival' }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20"
          # 1. Pull latest code on the server
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $REPO_PATH && git pull --ff-only origin main"
          # 2. Upload the freshly built assets (server has no Node)
          sshpass -e rsync -az --delete -e "ssh $SSH_OPTS" \
            public/build/ "$DEPLOY_USER@$DEPLOY_HOST:$REPO_PATH/public/build/"
          # 3. Run the production deploy steps
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
            set -e
            cd ~/repositories/iriseuroperevival
            PHP=/opt/cpanel/ea-php84/root/usr/bin/php
            $PHP /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            $PHP artisan migrate --force
            $PHP artisan storage:link || true
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            $PHP artisan filament:optimize
            $PHP artisan queue:restart
          REMOTE
